<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SAGA - Reportes</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS del sidebar -->
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" type="text/css" href="../css/reportes.css">
</head>
<body>

<!-- SIDEBAR -->
<div id="header"></div>

<!-- CONTENIDO -->
<div class="page-content">

        <div class="d-flex justify-content-between align-items-center mb-4">
        <h4>Reportes y Transparencia</h4>
    </div>


    <!-- FILTROS -->
    <div class="card card-custom mb-4">
        <div class="card-body">
            <h6 class="mb-3">Controles de Filtrado</h6>

            <div class="row g-3 align-items-end">

                <div class="col-md-4">
                    <label class="form-label">Reunión</label>
                    <select class="form-select">
                        <option selected>Seleccionar reunión</option>
                        <option>Reunión Enero</option>
                        <option>Reunión Febrero</option>
                        <option>Reunión Marzo</option>
                    </select>
                </div>

                <div class="col-md-3">
                    <label class="form-label">Fecha</label>
                    <input type="date" class="form-control">
                </div>
                <div class="col-md-2">
                    <button class="btn btn-primary w-100">Aplicar Filtros</button>
                </div>

            </div>
        </div>
    </div>

    <!-- GRÁFICA -->
    <div class="card card-custom mb-4">
        <div class="card-body">
            <h6 class="mb-3">Asistencia General vs. Ausencia</h6>
            <canvas id="asistenciaChart" height="100"></canvas>
        </div>
    </div>

    <!-- BOTÓN EXPORTAR -->
    <div class="text-end">
        <button class="btn btn-export">
            ⬇ Exportar a PDF / Excel
        </button>
    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- Script Sidebar -->
<script>
fetch("../components/header.html")
    .then(response => response.text())
    .then(data => {
        document.getElementById("header").innerHTML = data;

        const currentPage = window.location.pathname.split("/").pop();
        const links = document.querySelectorAll(".nav-link");

        links.forEach(link => {
            const linkPage = link.getAttribute("href").split("/").pop();

            if (linkPage === currentPage) {
                link.classList.add("active");
            }
        });
    });
</script>

<!-- Script Gráfica -->
<script>
    const ctx = document.getElementById('asistenciaChart');

    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ['Presente', 'Ausente'],
            datasets: [{
                label: 'Porcentaje (%)',
                data: [75, 25],
                backgroundColor: ['#4CAF50', '#F44336']
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: {
                    display: true
                }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    max: 100
                }
            }
        }
    });
</script>

</body>
</html>
