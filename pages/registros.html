<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SAGA - Registros</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS del sidebar -->
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" type="text/css" href="../css/registros.css">
</head>
<body>

<!-- SIDEBAR DINÁMICO -->
<div id="header"></div>

<!-- NAVBAR SUPERIOR -->
<div class="topbar">
    <h5>Sistema Automatizado de Gestión de Asistencias (SAGA)</h5>
</div>

<!-- CONTENIDO -->
<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4>Registro de Asistencias</h4>
    </div>


    <!-- CREAR NUEVA REUNIÓN -->
    <div class="card mb-4 shadow-sm">
        <div class="card-header bg-success text-white">
            Crear Nueva Reunión
        </div>
        <div class="card-body">
            <form>
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Nombre de la reunión</label>
                        <input type="text" class="form-control" placeholder="Ej. Reunión Abril">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Fecha</label>
                        <input type="date" class="form-control">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Descripción</label>
                        <input type="text" class="form-control" placeholder="Opcional">
                    </div>
                </div>

                <button type="submit" class="btn btn-success">
                    Crear Reunión
                </button>
            </form>
        </div>
    </div>



    <!-- MARCAR ASISTENCIA -->
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            Buscar Miembro y Marcar Asistencia
        </div>
        <div class="card-body">

            <!-- Seleccionar reunión -->
            <div class="mb-3">
                <label class="form-label">Seleccionar reunión activa</label>
                <select class="form-select">
                    <option selected disabled>Seleccione una reunión</option>
                    <option>Reunión Abril</option>
                    <option>Reunión Mayo</option>
                </select>
            </div>

            <!-- Buscador -->
            <h6 class="mb-3">Buscar por Nombre o ID</h6>

            <div class="input-group mb-3">
                <input type="text" class="form-control" placeholder="Ingrese nombre o ID...">
                <button class="btn btn-primary">Buscar</button>
            </div>

            <!-- Resultado ejemplo -->
            <div class="text-ejemplo">
                <p><strong>Nombre:</strong> Juan Pérez</p>
                <p><strong>ID:</strong> 15</p>

                <button class="btn btn-success btn-sm btn-asistencia">
                    Marcar Asistencia
                </button>
            </div>

        </div>
    </div>

</div>


<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Cargar Sidebar -->
<script>
fetch("../components/header.html")
    .then(response => response.text())
    .then(data => {
        document.getElementById("header").innerHTML = data;

        const currentPage = window.location.pathname.split("/").pop();
        const links = document.querySelectorAll(".nav-link");

        links.forEach(link => {
            const linkPage = link.getAttribute("href").split("/").pop();

            if (linkPage === currentPage) {
                link.classList.add("active");
            }
        });
    });
</script>

</body>
</html>
